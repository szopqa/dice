<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Catan Dice: arcade-style dice for your Catan table.">
  <title>Catan Dice</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="flash" id="flash" aria-hidden="true"></div>
  <div class="banner" id="banner" aria-live="polite"></div>

  <main class="app">
    <section class="screen" id="setup-screen" hidden>
      <h1 class="title">Catan Dice</h1>
      <p class="subtitle">Players, in turn order</p>
      <form id="setup-form" novalidate>
        <ul class="names" id="names"></ul>
        <p class="error" id="setup-error" role="alert" aria-live="assertive"></p>
        <div class="row">
          <button class="btn btn--alt" type="button" id="add-player">+ Add player</button>
          <button class="btn btn--go" type="submit" id="start">Start game</button>
        </div>
      </form>
    </section>

    <section class="screen" id="game-screen" hidden>
      <h1 class="title title--small">Catan Dice</h1>
      <p class="turn" id="turn"></p>
      <div class="dice" id="dice">
        <div class="die" id="die-0" role="img" aria-label="Die"></div>
        <div class="die" id="die-1" role="img" aria-label="Die"></div>
      </div>
      <p class="sum" id="sum" aria-hidden="true"></p>
      <p class="rolled" id="rolled" aria-live="polite"></p>
      <p class="comment" id="comment" aria-live="polite"></p>

      <div class="controls">
        <button class="btn btn--roll" type="button" id="roll">ROLL</button>
        <div class="row row--4">
          <button class="btn btn--small" type="button" id="prev" aria-label="Previous player">◀</button>
          <button class="btn btn--small" type="button" id="reroll">Re-roll</button>
          <button class="btn btn--small" type="button" id="undo" aria-label="Undo last roll">Undo</button>
          <button class="btn btn--small" type="button" id="next" aria-label="Next player">▶</button>
        </div>
        <div class="row">
          <button class="btn btn--small btn--alt" type="button" id="new-game">New game</button>
          <button class="btn btn--small btn--alt" type="button" id="silent" aria-pressed="false">🔊 Sound</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
